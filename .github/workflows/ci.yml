name: CI

# Manual for now: GitHub does not start jobs on this account until its billing lock is
# lifted ("The job was not started because your account is locked due to a billing
# issue"). Restore the push and pull_request triggers below once it is resolved.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test (TypeScript + Rust)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: npm run check
        run: npm run check
