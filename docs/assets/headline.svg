<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 64" width="760" height="64" role="img" aria-labelledby="t">
  <title id="t">Select text anywhere and Typely will fix every typo, sound professional, say it in fewer words, translate it, or sharpen your prompt.</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="0.55" stop-color="#9b6bff"/>
      <stop offset="1" stop-color="#2fc48d"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 30px; font-weight: 700; }
    .lead { fill: #8b93a7; }
    .w { fill: url(#g); opacity: 0; animation: cycle 12.5s infinite; }
    .w2 { animation-delay: 2.5s; } .w3 { animation-delay: 5s; } .w4 { animation-delay: 7.5s; } .w5 { animation-delay: 10s; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(14px); }
      4%, 16% { opacity: 1; transform: translateY(0); }
      20%, 100% { opacity: 0; transform: translateY(-14px); }
    }
    .caret { fill: #9b6bff; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .w { animation: none; } .w1 { opacity: 1; } .caret { animation: none; }
    }
  </style>
  <text x="8" y="43" class="lead">Typely will</text>
  <g>
    <text x="172" y="43" class="w w1">fix every typo.</text>
    <text x="172" y="43" class="w w2">make it sound professional.</text>
    <text x="172" y="43" class="w w3">say it in fewer words.</text>
    <text x="172" y="43" class="w w4">translate it to Arabic.</text>
    <text x="172" y="43" class="w w5">sharpen your AI prompt.</text>
  </g>
</svg>
