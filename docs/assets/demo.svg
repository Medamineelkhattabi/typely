<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d">
  <title id="t">Typely demo</title>
  <desc id="d">Select text in any app, press Ctrl+Shift+Space: the floating panel shows instant local fixes, streams the local model's correction, and Replace pastes it back.</desc>
  <style>
    .ui { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; }
    .mono { font-family: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; }
    .muted { fill: #9aa0ad; }
    .ins { fill: #9fe3b4; font-weight: 600; }
    .del { fill: #ff8a80; text-decoration: line-through; }
    /* 12 s loop; every element animates on the same clock. */
    .loop { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: ease; }
    .sel { animation-name: sel; opacity: 0; }
    @keyframes sel { 0%, 10% { opacity: 0; } 13%, 66% { opacity: 1; } 69%, 100% { opacity: 0; } }
    .before { animation-name: before; }
    @keyframes before { 0%, 68% { opacity: 1; } 70%, 96% { opacity: 0; } 98%, 100% { opacity: 1; } }
    .after { animation-name: after; opacity: 0; }
    @keyframes after { 0%, 68% { opacity: 0; } 71%, 95% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .keys { animation-name: keys; opacity: 0; }
    @keyframes keys { 0%, 16% { opacity: 0; transform: translateY(8px); } 19%, 27% { opacity: 1; transform: translateY(0); } 30%, 100% { opacity: 0; transform: translateY(0); } }
    .panel { animation-name: panel; opacity: 0; }
    @keyframes panel { 0%, 23% { opacity: 0; transform: translateY(10px); } 26%, 66% { opacity: 1; transform: translateY(0); } 69%, 100% { opacity: 0; transform: translateY(0); } }
    .local { animation-name: local; opacity: 0; }
    @keyframes local { 0%, 27% { opacity: 0; } 28%, 37% { opacity: 1; } 39%, 100% { opacity: 0; } }
    .stream { animation-name: stream; opacity: 0; }
    @keyframes stream { 0%, 37% { opacity: 0; } 39%, 47% { opacity: 1; } 49%, 100% { opacity: 0; } }
    .reveal { animation-name: reveal; }
    @keyframes reveal { 0%, 38% { transform: scaleX(0); } 47%, 100% { transform: scaleX(1); } }
    .final { animation-name: final; opacity: 0; }
    @keyframes final { 0%, 47% { opacity: 0; } 49%, 66% { opacity: 1; } 69%, 100% { opacity: 0; } }
    .press { animation-name: press; transform-box: fill-box; transform-origin: center; }
    @keyframes press { 0%, 59% { transform: scale(1); } 61% { transform: scale(0.92); } 63%, 100% { transform: scale(1); } }
    .cursor { animation-name: cursor; opacity: 0; }
    @keyframes cursor { 0%, 52% { opacity: 0; transform: translate(80px, 60px); } 55% { opacity: 1; } 59%, 63% { opacity: 1; transform: translate(0, 0); } 66%, 100% { opacity: 0; transform: translate(0, 0); } }
    .done { animation-name: done; opacity: 0; }
    @keyframes done { 0%, 70% { opacity: 0; } 73%, 93% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .loop { animation: none; }
      .sel, .panel, .final { opacity: 1; }
      .before { opacity: 1; }
      .local, .stream, .keys, .cursor, .after, .done { opacity: 0; }
    }
  </style>

  <!-- Backdrop -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="1" stop-color="#1b2030"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="900" height="460" rx="18" fill="url(#bg)"/>

  <!-- Editor window -->
  <g filter="url(#shadow)">
    <rect x="40" y="36" width="820" height="388" rx="12" fill="#202020" stroke="#2f3340"/>
    <rect x="40" y="36" width="820" height="40" rx="12" fill="#272727"/>
    <rect x="40" y="62" width="820" height="14" fill="#272727"/>
    <circle cx="66" cy="56" r="6" fill="#ff5f57"/><circle cx="86" cy="56" r="6" fill="#febc2e"/><circle cx="106" cy="56" r="6" fill="#28c840"/>
    <text x="450" y="61" text-anchor="middle" class="ui muted" font-size="13">Any app · Notepad, a browser text field, a chat box…</text>
  </g>

  <!-- Selection + original text -->
  <rect class="loop sel" x="62" y="104" width="626" height="26" rx="3" fill="#2f5bea" fill-opacity="0.55"/>
  <g class="loop before">
    <text x="66" y="122" class="mono" font-size="15" fill="#e8e9ed">i think teh the report is ready , can you check it?it is due tomorrow</text>
    <path d="M 147 127 q 3 3 6 0 t 6 0 t 6 0 t 6 0" stroke="#ff6b6b" stroke-width="1.4" fill="none"/>
  </g>
  <g class="loop after">
    <text x="66" y="122" class="mono" font-size="15" fill="#e8e9ed">I think the report is ready, can you check it? It is due tomorrow.</text>
  </g>
  <g class="loop done">
    <rect x="66" y="146" width="232" height="26" rx="13" fill="#173d25"/>
    <text x="182" y="164" text-anchor="middle" class="ui ins" font-size="13">✓ Replaced · Ctrl+Z to undo</text>
  </g>

  <!-- Shortcut keys -->
  <g transform="translate(250 -224)">
  <g class="loop keys ui" font-size="14" font-weight="600">
    <rect x="300" y="376" width="62" height="32" rx="7" fill="#2b2f3a" stroke="#4a5163"/><text x="331" y="397" text-anchor="middle" fill="#e8e9ed">Ctrl</text>
    <text x="372" y="397" text-anchor="middle" class="muted">+</text>
    <rect x="382" y="376" width="66" height="32" rx="7" fill="#2b2f3a" stroke="#4a5163"/><text x="415" y="397" text-anchor="middle" fill="#e8e9ed">Shift</text>
    <text x="458" y="397" text-anchor="middle" class="muted">+</text>
    <rect x="468" y="376" width="132" height="32" rx="7" fill="#2b2f3a" stroke="#4a5163"/><text x="534" y="397" text-anchor="middle" fill="#e8e9ed">Space</text>
  </g>
  </g>

  <!-- Floating panel -->
  <g class="loop panel ui">
    <g filter="url(#shadow)">
      <rect x="64" y="142" width="470" height="262" rx="10" fill="#1d1f24" stroke="#3a3e47"/>
    </g>
    <text x="82" y="168" font-size="14" font-weight="700" fill="#e8e9ed">Typely</text>
    <text x="136" y="168" font-size="12" class="muted">Notepad.exe · Ollama · fast</text>
    <text x="512" y="169" font-size="16" class="muted">×</text>
    <line x1="64" y1="180" x2="534" y2="180" stroke="#3a3e47"/>
    <!-- operation chips -->
    <g font-size="11.5">
      <rect x="80" y="190" width="58" height="22" rx="11" fill="#6b8cff"/><text x="109" y="205" text-anchor="middle" fill="#0d1020" font-weight="600">Correct</text>
      <rect x="144" y="190" width="58" height="22" rx="11" fill="#26292f" stroke="#3a3e47"/><text x="173" y="205" text-anchor="middle" fill="#e8e9ed">Rewrite</text>
      <rect x="208" y="190" width="80" height="22" rx="11" fill="#26292f" stroke="#3a3e47"/><text x="248" y="205" text-anchor="middle" fill="#e8e9ed">Professional</text>
      <rect x="294" y="190" width="58" height="22" rx="11" fill="#26292f" stroke="#3a3e47"/><text x="323" y="205" text-anchor="middle" fill="#e8e9ed">Concise</text>
      <rect x="358" y="190" width="70" height="22" rx="11" fill="#26292f" stroke="#3a3e47"/><text x="393" y="205" text-anchor="middle" fill="#e8e9ed">Translate</text>
      <rect x="434" y="190" width="84" height="22" rx="11" fill="#26292f" stroke="#3a3e47"/><text x="476" y="205" text-anchor="middle" fill="#e8e9ed">Improve prompt</text>
    </g>

    <!-- 1. instant local result -->
    <g class="loop local">
      <text x="82" y="238" font-size="11.5" class="muted">⚡ Instant local fixes · 31 ms</text>
      <text x="82" y="260" font-size="13.5" fill="#e8e9ed">I think the report is ready, can you check it? It is due tomorrow</text>
      <text x="82" y="290" font-size="11.5" class="muted">◌ Waiting for the model…</text>
    </g>

    <!-- 2. streaming -->
    <g class="loop stream">
      <text x="82" y="238" font-size="11.5" class="muted">◍ gemma3:1b on this PC · streaming…</text>
      <clipPath id="streamclip"><rect class="loop reveal" x="82" y="244" width="430" height="24" style="transform-origin: 82px 0"/></clipPath>
      <text x="82" y="260" font-size="13.5" fill="#e8e9ed" clip-path="url(#streamclip)">I think the report is ready, can you check it? It is due tomorrow.▍</text>
    </g>

    <!-- 3. final result with diff and explanations -->
    <g class="loop final">
      <text x="82" y="244" font-size="13.5" fill="#e8e9ed"><tspan class="del">i</tspan><tspan class="ins">I</tspan> think <tspan class="del">teh</tspan> the report is ready<tspan class="del"> ,</tspan><tspan class="ins">,</tspan> can you check it?<tspan class="ins"> </tspan><tspan class="del">it</tspan><tspan class="ins">It</tspan> is due tomorrow<tspan class="ins">.</tspan></text>
      <g font-size="11.5">
        <text x="88" y="270"><tspan class="del">teh the</tspan><tspan class="muted"> → </tspan><tspan class="ins">the</tspan><tspan class="muted">  Repeated word / spelling</tspan></text>
        <text x="88" y="288"><tspan class="del">i</tspan><tspan class="muted"> → </tspan><tspan class="ins">I</tspan><tspan class="muted">  A sentence starts with a capital letter</tspan></text>
        <text x="88" y="306"><tspan class="del"> ,</tspan><tspan class="muted"> → </tspan><tspan class="ins">,</tspan><tspan class="muted">  No space before a comma</tspan></text>
        <text x="82" y="330" class="muted" font-size="10.5">gemma3:1b · en · local, nothing left this computer</text>
      </g>
    </g>

    <!-- footer -->
    <line x1="64" y1="350" x2="534" y2="350" stroke="#3a3e47"/>
    <rect x="374" y="362" width="62" height="28" rx="6" fill="#26292f" stroke="#3a3e47"/><text x="405" y="381" text-anchor="middle" font-size="13" fill="#e8e9ed">Copy</text>
    <g class="loop press">
      <rect x="444" y="362" width="76" height="28" rx="6" fill="#6b8cff"/><text x="482" y="381" text-anchor="middle" font-size="13" font-weight="600" fill="#0d1020">Replace</text>
    </g>
  </g>

  <!-- mouse pointer -->
  <g class="loop cursor">
    <path d="M 488 372 l 0 20 l 5 -5 l 4 9 l 4 -2 l -4 -9 l 7 0 z" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
  </g>

  <!-- tagline -->
  <text x="450" y="446" text-anchor="middle" class="ui muted" font-size="12">Select · Ctrl+Shift+Space · Replace — local rules in milliseconds, a local model in about two seconds</text>
</svg>
