<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-labelledby="t d">
  <title id="t">What happens in the first two seconds</title>
  <desc id="d">Measured with a warm local model on a short message: the shortcut at 0 ms, instant local fixes in about 30 ms, the model's first words after about half a second, and the final result in about 1.4 to 2 seconds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="1" stop-color="#1b2030"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fc48d"/>
      <stop offset="0.35" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
  </defs>
  <style>
    .ui { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; }
    .muted { fill: #8b93a7; }
    .label { fill: #e8e9ed; font-weight: 600; }
    .fill { transform-origin: 60px 0; animation: grow 6s infinite cubic-bezier(.3,.7,.4,1); }
    @keyframes grow { 0% { transform: scaleX(0); } 55%, 85% { transform: scaleX(1); } 95%, 100% { transform: scaleX(1); opacity: 0.4; } }
    .dot { opacity: 0.25; animation: light 6s infinite; }
    .d2 { animation-delay: 0.25s; } .d3 { animation-delay: 1.1s; } .d4 { animation-delay: 2.9s; }
    @keyframes light { 0% { opacity: 0.25; } 4%, 85% { opacity: 1; } 95%, 100% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) { .fill, .dot { animation: none; opacity: 1; } }
  </style>
  <rect width="900" height="200" rx="18" fill="url(#bg)"/>
  <text x="32" y="40" class="ui label" font-size="17">The first two seconds</text>
  <text x="868" y="40" class="ui muted" font-size="12.5" text-anchor="end">warm local model · short message · measured</text>

  <rect x="60" y="94" width="780" height="8" rx="4" fill="#2a2f3c"/>
  <rect class="fill" x="60" y="94" width="780" height="8" rx="4" fill="url(#bar)"/>

  <g class="dot d1">
    <circle cx="60" cy="98" r="9" fill="#2fc48d"/>
    <text x="60" y="76" class="ui label" font-size="13" text-anchor="middle">Shortcut</text>
    <text x="60" y="130" class="ui muted" font-size="12" text-anchor="middle">0 ms</text>
  </g>
  <g class="dot d2">
    <circle cx="170" cy="98" r="9" fill="#2fc48d"/>
    <text x="170" y="76" class="ui label" font-size="13" text-anchor="middle">Local fixes</text>
    <text x="170" y="130" class="ui muted" font-size="12" text-anchor="middle">~30 ms</text>
  </g>
  <g class="dot d3">
    <circle cx="380" cy="98" r="9" fill="#5b8cff"/>
    <text x="380" y="76" class="ui label" font-size="13" text-anchor="middle">First AI words</text>
    <text x="380" y="130" class="ui muted" font-size="12" text-anchor="middle">~0.5 s</text>
  </g>
  <g class="dot d4">
    <circle cx="840" cy="98" r="9" fill="#9b6bff"/>
    <text x="840" y="76" class="ui label" font-size="13" text-anchor="end">Final result · Replace</text>
    <text x="840" y="130" class="ui muted" font-size="12" text-anchor="end">~1.4–2 s</text>
  </g>
  <text x="450" y="176" class="ui muted" font-size="12" text-anchor="middle">Nothing is loaded at startup or while you type · the model is released after 5 idle minutes</text>
</svg>
