<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d">
  <title id="t">Typely in English, French and Arabic</title>
  <desc id="d">Three real corrections. English: "i think teh the report is ready , can you check it?it is due tomorow" becomes "I think the report is ready, can you check it? It is due tomorrow." French: "Je suis allé a la réunion hier , c'etait vraiment interessant ." becomes "Je suis allé à la réunion hier, c'était vraiment intéressant." Arabic: "هل وصلك الملف ? ارجو الرد بسرعة لان العميل ينتظر" becomes "هل وصلك الملف؟ أرجو الرد بسرعة لأن العميل ينتظر".</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="1" stop-color="#1b2030"/>
    </linearGradient>
  </defs>
  <style>
    .ui { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; }
    .ar { font-family: "Segoe UI", "Noto Naskh Arabic", "Arial", sans-serif; }
    .muted { fill: #8b93a7; }
    .before { fill: #c9ccd6; }
    .after { fill: #e8e9ed; }
    .ins { fill: #9fe3b4; font-weight: 700; }
    .del { fill: #ff8a80; text-decoration: line-through; }
    .row { opacity: 0.35; animation: focus 9s infinite; }
    .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; }
    @keyframes focus { 0%, 3% { opacity: 0.35; } 8%, 30% { opacity: 1; } 36%, 100% { opacity: 0.35; } }
    .arrow { animation: nudge 9s infinite; }
    .r2 .arrow { animation-delay: 3s; } .r3 .arrow { animation-delay: 6s; }
    @keyframes nudge { 0%, 8% { transform: translateX(0); } 14% { transform: translateX(6px); } 20%, 100% { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { .row, .arrow { animation: none; opacity: 1; } }
  </style>
  <rect width="900" height="380" rx="18" fill="url(#bg)"/>
  <text x="32" y="44" class="ui" font-size="17" font-weight="700" fill="#e8e9ed">One shortcut, three languages</text>
  <text x="868" y="44" class="ui muted" font-size="12.5" text-anchor="end">Real results · local models on this PC</text>

  <!-- English -->
  <g class="row r1">
    <rect x="24" y="66" width="852" height="92" rx="12" fill="#1d2029" stroke="#2f3442"/>
    <rect x="40" y="82" width="38" height="22" rx="11" fill="#26324f"/><text x="59" y="98" class="ui" font-size="12" font-weight="700" fill="#8fb0ff" text-anchor="middle">EN</text>
    <text x="92" y="98" class="ui before" font-size="14.5">i think teh the report is ready , can you check it?it is due tomorow</text>
    <g class="arrow"><text x="40" y="138" class="ui" font-size="16" fill="#6b8cff">→</text></g>
    <text x="66" y="138" class="ui after" font-size="14.5"><tspan class="ins">I</tspan> think the report is ready<tspan class="ins">,</tspan> can you check it?<tspan class="ins"> It</tspan> is due <tspan class="ins">tomorrow.</tspan></text>
  </g>

  <!-- French -->
  <g class="row r2">
    <rect x="24" y="170" width="852" height="92" rx="12" fill="#1d2029" stroke="#2f3442"/>
    <rect x="40" y="186" width="38" height="22" rx="11" fill="#3a2a4f"/><text x="59" y="202" class="ui" font-size="12" font-weight="700" fill="#c9a6ff" text-anchor="middle">FR</text>
    <text x="92" y="202" class="ui before" font-size="14.5">Je suis allé a la réunion hier , c'etait vraiment interessant .</text>
    <g class="arrow"><text x="40" y="242" class="ui" font-size="16" fill="#6b8cff">→</text></g>
    <text x="66" y="242" class="ui after" font-size="14.5">Je suis allé <tspan class="ins">à</tspan> la réunion hier<tspan class="ins">,</tspan> <tspan class="ins">c'était</tspan> vraiment <tspan class="ins">intéressant.</tspan></text>
  </g>

  <!-- Arabic (right to left) -->
  <g class="row r3">
    <rect x="24" y="274" width="852" height="92" rx="12" fill="#1d2029" stroke="#2f3442"/>
    <rect x="822" y="290" width="38" height="22" rx="11" fill="#1f3b33"/><text x="841" y="306" class="ui" font-size="12" font-weight="700" fill="#8fe0c0" text-anchor="middle">AR</text>
    <text x="808" y="306" class="ar before" font-size="16" direction="rtl" text-anchor="start">هل وصلك الملف ? ارجو الرد بسرعة لان العميل ينتظر</text>
    <g class="arrow"><text x="860" y="346" class="ui" font-size="16" fill="#6b8cff" text-anchor="end">←</text></g>
    <text x="834" y="346" class="ar after" font-size="16" direction="rtl" text-anchor="start">هل وصلك <tspan class="ins">الملف؟</tspan> <tspan class="ins">أرجو</tspan> الرد بسرعة <tspan class="ins">لأن</tspan> العميل ينتظر</text>
  </g>
</svg>
