[package]
name = "typely-desktop"
version = "0.1.0"
description = "Typely desktop app: the trusted executor for the shared correction engine"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "typely_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "typely"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
keyring = "=4.2.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "http2", "stream", "system-proxy"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.153"
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "=2.5.3"
tokio = { version = "=1.53.3", features = ["macros", "sync", "time"] }
tokio-util = "=0.7.20"
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
